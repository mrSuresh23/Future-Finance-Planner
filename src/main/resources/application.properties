spring.application.name=future-finance-planner
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/future_finance?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
